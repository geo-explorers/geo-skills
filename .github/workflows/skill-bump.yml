name: skill-bump

# Bumps the version of every skill a pull request changes, so nobody edits
# version lines, changelog headings or the manifest by hand.
#
# Level: patch, or the label bump:minor / bump:major on the pull request.
# The bot (skill-dev/bump_skills.py) sets each changed skill's version, adds its
# skills/versions.md entry and MD-FILES.md version, regenerates the manifest,
# and pushes one commit to the pull request's branch.
#
# The bot pushes as the bump app (geo-skills-bump), not with this workflow's own
# token: a push by the built-in github-actions[bot] made GitHub hold the next
# checks for a maintainer's approval ("Approve workflows to run"). The app's push
# starts `verify` normally on the bot's commit. Until then the first `verify` on
# a skill change is red (DRIFT): expected.
#
# The app can only write contents in geo-skills and is not on the tag ruleset's
# bypass list, so its key (repository variable BUMP_APP_ID, secret
# BUMP_APP_PRIVATE_KEY) gives nothing a person with write access lacks.
#
# Pull requests from forks can't be pushed to; their authors bump by hand
# (MAINTAINERS.md, "Changing a skill").

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: skill-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || startsWith(github.event.label.name, 'bump:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LEVEL: ${{ contains(github.event.pull_request.labels.*.name, 'bump:major') && 'major' || contains(github.event.pull_request.labels.*.name, 'bump:minor') && 'minor' || 'patch' }}
    steps:
      - name: Forks bump by hand
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::warning::This pull request comes from a fork, so the bot can't push to it. Bump the changed skills by hand: see MAINTAINERS.md, Changing a skill."

      - name: Get a one-hour token from the bump app
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@v5
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          python-version: "3.x"

      - name: Bump
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: bump
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          python3 skill-dev/bump_skills.py --base "$base" --level "$LEVEL" --title "$PR_TITLE" --pr "$PR_NUMBER"
          if [ -z "$(git status --porcelain -- skills MD-FILES.md)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 skill-dev/skill_versions.py verify
          python3 skill-dev/check_md_manifest.py || echo "::warning::MD-FILES.md still needs a hand edit (see above)."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the bump
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # Commit as the app's bot user, <slug>[bot]; its push starts `verify` itself.
          bot="${APP_SLUG}[bot]"
          id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "$bot"
          git config user.email "$id+$bot@users.noreply.github.com"
          git add -A skills MD-FILES.md
          git commit --quiet -m "Bump skill versions ($LEVEL)"
          git push --quiet origin "HEAD:refs/heads/$HEAD_REF"
