name: Verify skill integrity

# Fails the build if any shipped skill changed without being re-approved
# (bump version + changelog + `python3 skill-dev/skill_versions.py generate`),
# if MD-FILES.md no longer matches the repo's Markdown files, or if shipped code
# points at the retired Geo endpoint.
#
# This is a REQUIRED status check on main, so it runs on every pull request with
# no path filter: a required check that is skipped never reports, and the pull
# request would wait on it forever.
#
# workflow_dispatch: a maintainer can start a run by hand (Actions → Run workflow).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the script reads git log/ls-files — needs full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify skills match their approved versions
        run: python3 skill-dev/skill_versions.py verify
      - name: Verify MD-FILES.md matches the repo
        run: python3 skill-dev/check_md_manifest.py
      - name: The release calculator gives the right versions
        env:
          REQUIRE_RELEASE_TAGS: "1"
        run: python3 skill-dev/test_suggest_release.py
      - name: The version bump bot behaves
        run: python3 skill-dev/test_bump_skills.py
      # The retired host refuses connections; the live one is api-testnet.geobrowser.io.
      - name: No retired Geo endpoint in shipped code
        run: |
          if git grep -n -F 'https://testnet-api.geobrowser.io' -- skills lib src scripts; then
            echo "::error::Retired Geo endpoint found above. Use https://api-testnet.geobrowser.io/graphql"
            exit 1
          fi
